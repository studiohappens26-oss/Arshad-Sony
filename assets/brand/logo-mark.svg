  <!-- sound waves -->
  <path d="M37.5 22.5 a6 6 0 0 1 0 9" stroke="url(#rg)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M42 18.5 a11.5 11.5 0 0 1 0 17" stroke="url(#rg)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".75"/>
  <path d="M46.5 14.5 a17 17 0 0 1 0 25" stroke="url(#rg)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".45"/>
</svg>
