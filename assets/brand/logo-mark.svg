<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RDL Sony Centre mark">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d2b8"/>
      <stop offset=".5" stop-color="#ebb28c"/>
      <stop offset="1" stop-color="#a87452"/>
    </linearGradient>
    <linearGradient id="mr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1424"/>
      <stop offset="1" stop-color="#3d0410"/>
    </linearGradient>
  </defs>
  <!-- screen -->
  <rect x="4" y="6" width="56" height="42" rx="10" fill="url(#mr)" stroke="url(#rg)" stroke-width="2.5"/>
  <!-- stand -->
  <path d="M27 48.5 L25 55 M37 48.5 L39 55 M20 56 H44" stroke="url(#rg)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- R monogram -->
